spring:
  application:
    name: compliance-api

  datasource:
    url: jdbc:postgresql://localhost:5432/complianceos
    username: complianceos_app
    password: dev_password_change_in_prod
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-init-sql: SET app.current_tenant = '00000000-0000-0000-0000-000000000000'

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/complianceos
          jwk-set-uri: http://localhost:8180/realms/complianceos/protocol/openid-connect/certs

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html

complianceos:
  activation:
    jwt:
      secret: "dev-secret-key-minimum-32-chars-complianceos-2025"
    expiration-hours: 24
  keycloak:
    server-url: http://localhost:8180
    realm: complianceos
    client-id: complianceos-api
    client-secret: dev-secret-change-in-prod
    admin-username: admin
    admin-password: admin
  frontend:
    url: http://localhost:3000