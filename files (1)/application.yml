# ─────────────────────────────────────────────────────────────────────────────
#  ComplianceOS — Configuration Spring Boot
#  Profil : dev (local avec Docker Compose)
# ─────────────────────────────────────────────────────────────────────────────

spring:
  application:
    name: compliance-api

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/complianceos
    username: complianceos_app
    password: dev_password_change_in_prod
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      # Initialise la variable RLS pour chaque connexion
      connection-init-sql: SET app.current_tenant = '00000000-0000-0000-0000-000000000000'

  # ── JPA / Hibernate ────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gère le schéma, Hibernate vérifie seulement
    show-sql: false               # Passer à true pour debug
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway (migrations SQL) ────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Keycloak OAuth2 Resource Server ───────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak tourne sur le port 8180 en dev (docker-compose)
          issuer-uri: http://localhost:8180/realms/complianceos
          jwk-set-uri: http://localhost:8180/realms/complianceos/protocol/openid-connect/certs

  # ── Redis ──────────────────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ── E-mail (MailHog en dev) ────────────────────────────────────────────────
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# ── Serveur ────────────────────────────────────────────────────────────────────
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ── Actuator (health checks, métriques) ───────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

# ── Configuration ComplianceOS ────────────────────────────────────────────────
complianceos:
  activation:
    jwt:
      # IMPORTANT : changer cette valeur en prod (min 32 caractères)
      # En prod : récupérer depuis Vault
      secret: "dev-secret-key-minimum-32-chars-complianceos-2025"
    expiration-hours: 24

  keycloak:
    server-url: http://localhost:8180
    realm: complianceos
    client-id: complianceos-api
    client-secret: dev-secret-change-in-prod
    admin-username: admin
    admin-password: admin

  frontend:
    url: http://localhost:3000
